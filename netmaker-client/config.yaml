---
name: Netmaker Client
version: 1.6.0-1
slug: netmaker-client
description: |
  Netmaker WireGuard Client

  Joins a Netmaker mesh network using the official netclient. Runs as a
  plain WireGuard peer.
environment:
  PUID: "0"
  PGID: "0"
  TZ: Etc/UTC
options:
  host_name: homeassistant-netmaker
  netclient_token: ""
  debug_mode: false
  auto_restart: true
schema:
  host_name: str
  netclient_token: str
  debug_mode: bool
  auto_restart: bool
init: false
startup: services
privileged:
  - NET_ADMIN
devices:
  - "/dev/net/tun"
arch:
  - aarch64
  - amd64
map:
  - addon_config:rw
boot: auto
codenotary: red.avtovo@gmail.com
image: "ghcr.io/j0rsa/haddon-netmaker-client-{arch}"
udev: false
url: https://github.com/j0rsa/home-assistant-apps
panel_icon: mdi:vpn
