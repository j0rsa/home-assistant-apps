worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 0;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Home Assistant Ingress → RustFS console on :9001
    server {
        listen 8099 default_server;
        listen [::]:8099 default_server;

        # Ingress gateway only
        allow 172.30.32.2;
        deny all;

        proxy_buffering off;
        proxy_request_buffering off;

        # Console is served under /rustfs/console, not /
        location = / {
            return 302 $scheme://$http_host$http_x_ingress_path/rustfs/console/;
        }

        location / {
            proxy_pass http://127.0.0.1:9001;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Needed so sub_filter can rewrite response bodies
            proxy_set_header Accept-Encoding "";

            proxy_redirect / $http_x_ingress_path/;
            proxy_redirect http://127.0.0.1:9001/ $http_x_ingress_path/;
            proxy_redirect http://$http_host/ $http_x_ingress_path/;

            # Absolute /rustfs/... paths must stay under the ingress prefix
            sub_filter_once off;
            sub_filter_types text/css text/javascript application/javascript application/json;
            sub_filter 'href="/rustfs/' 'href="$http_x_ingress_path/rustfs/';
            sub_filter 'src="/rustfs/' 'src="$http_x_ingress_path/rustfs/';
            sub_filter 'url(/rustfs/' 'url($http_x_ingress_path/rustfs/';
            sub_filter '"/rustfs/' '"$http_x_ingress_path/rustfs/';
            sub_filter "'/rustfs/" "'$http_x_ingress_path/rustfs/";
            sub_filter '`/rustfs/' '`$http_x_ingress_path/rustfs/';
            sub_filter '(/rustfs/' '($http_x_ingress_path/rustfs/';
        }
    }
}
