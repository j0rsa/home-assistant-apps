name: Build app

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      apps:
        description: App directories to rebuild and publish (space or comma separated, e.g. "litellm netmaker-client")
        required: true
        type: string

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      matrix-count: ${{ steps.set-matrix.outputs.matrix-count }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1
        with:
          # Fetch 2 last commits to get the changes
          fetch-depth: 2

      - name: Generate matrix
        env:
          APPS: ${{ inputs.apps }}
        run: |
          # Manual runs build the requested apps; otherwise diff HEAD^..HEAD
          python get_matrix.py --apps "${APPS}"

      - name: Set matrix output
        id: set-matrix
        run: |
          echo "matrix=$(cat matrix.txt)" >> $GITHUB_OUTPUT
          echo "matrix-count=$(cat matrix-count.txt)" >> $GITHUB_OUTPUT
          cat matrix.txt > $GITHUB_STEP_SUMMARY


  build:
    name: Build ${{ matrix.target }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.matrix-count != '0' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Stamp PR version
        if: github.event_name == 'pull_request'
        run: |
          sed -i "s/^version:.*/version: 0.0.0-pr.${{ github.event.number }}.${{ github.run_number }}/" ${{ matrix.target }}/config.yaml

      - name: Read add-on version
        id: info
        env:
          TARGET: ${{ matrix.target }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          version=$(sed -n 's/^version:[[:space:]]*["'\'']\{0,1\}\([^"'\'' ]*\).*/\1/p' "${TARGET}/config.yaml")
          [[ -n "${version}" ]] || { echo "::error::No version in ${TARGET}/config.yaml"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${version}"
            [[ "${IS_PR}" == "true" ]] || echo "latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.target }} (${{ matrix.arch }})
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: ./${{ matrix.target }}
          image: ${{ matrix.image }}
          image-tags: ${{ steps.info.outputs.tags }}
          version: ${{ steps.info.outputs.version }}
          build-args: ${{ matrix.build_args }}
          labels: |
            io.hass.type=addon
            io.hass.name=${{ matrix.name }}
            io.hass.description=${{ matrix.description }}
            io.hass.url=${{ matrix.url }}
          # GHA cache export (mode=max) of multi-GB images like litellm crashes
          # buildkitd and would blow the 10 GB repo cache limit anyway; rely on
          # the registry inline cache from the previous `latest` image instead.
          cache-gha: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          push: "true"
          cosign: ${{ github.event_name != 'pull_request' }}

  # Single stable check to mark as required in branch protection: the per-addon
  # build jobs are dynamic, so their names can't be required individually.
  build-result:
    name: Build result
    runs-on: ubuntu-latest
    needs: [generate-matrix, build]
    if: always()
    steps:
      - name: Check build results
        env:
          MATRIX_RESULT: ${{ needs.generate-matrix.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "generate-matrix: ${MATRIX_RESULT}, build: ${BUILD_RESULT}"
          if [[ "${MATRIX_RESULT}" != "success" ]]; then
            echo "::error::Matrix generation ${MATRIX_RESULT}"
            exit 1
          fi
          # build is "skipped" when no add-on changed, which is fine
          if [[ "${BUILD_RESULT}" != "success" && "${BUILD_RESULT}" != "skipped" ]]; then
            echo "::error::One or more add-on builds ${BUILD_RESULT}"
            exit 1
          fi
