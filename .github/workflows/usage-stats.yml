name: Usage stats

# Daily snapshot of GHCR download counts per app. History and the rendered
# chart live on the orphan `stats` branch so main doesn't get daily commits;
# README embeds stats/downloads.svg from that branch.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: usage-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1

      - name: Check out stats branch
        run: |
          if git fetch --depth=1 origin stats:stats; then
            git worktree add stats-out stats
          else
            git worktree add --detach stats-out
            git -C stats-out checkout --orphan stats
            git -C stats-out rm -rfq .
          fi

      - name: Collect downloads and render chart
        run: |
          python3 scripts/usage_stats.py \
            --data stats-out/downloads.json \
            --svg stats-out/downloads.svg

      - name: Commit snapshot
        working-directory: stats-out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.json downloads.svg
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -qm "Usage stats $(date -u +%F)"
          git push origin stats
