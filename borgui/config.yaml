---
name: "BorgUI"
version: "0.1.0"
slug: "borgui"
description: |
  BorgBackup with a web UI. Create encrypted, deduplicated backups of your data and manage them from the browser.
init: false
startup: services
arch:
  - aarch64
  - amd64
map:
  - app_config:rw
  - share:rw
  - backup:rw
  - media:ro
boot: auto
image: "ghcr.io/j0rsa/haddon-borgui-{arch}"
udev: false
url: https://borgui.com
ingress: true
ingress_port: 8081
panel_icon: mdi:backup-restore
options:
  borg_path: /share/borg-mounts
schema:
  borg_path: str
privileged:
  - SYS_ADMIN
